[project]
name = "academic-research-ide-backend"
version = "0.1.0"
description = "Local FastAPI + SQLite + LanceDB backend for Academic Research IDE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.4",
    "lancedb>=0.15.0",
    "pyarrow>=17.0.0",
    "httpx>=0.27.0",
    "openai>=1.55.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
